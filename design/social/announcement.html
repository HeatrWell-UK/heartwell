<!doctype html><meta charset="utf-8">
<!-- Heartwell's "We're now Heartwell Sofa" post, 1080 x 1350 (4:5, the size Facebook and Instagram feeds show largest on phones).
     The owner's hero photo (square) with the name lit in its alcove, over a wine band with the promise and the address. No prices.
     Render: chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1080,1350 --virtual-time-budget=8000 --screenshot=out.png "file:///.../announcement.html" -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@500;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#4A0D17}
  /* The square photo, 1080 x 1080. Its alcove spans 17.5-82% across and 10-48% down (measured for the home hero). */
  .room{position:absolute;left:0;top:0;width:1080px;height:1080px;background:#5A181A url(https://res.cloudinary.com/iv3tp2iq/image/upload/q_95/v1792009391/Main-Hero-Background-Image.jpg) 0 0/100% 100% no-repeat}
  .gold{background-image:linear-gradient(100deg,#D6B260 0%,#F6E3A8 42%,#DDB968 68%,#F2DC9C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{position:absolute;left:540px;top:372px;transform:translate(-50%,-50%);margin:0;text-align:center;white-space:nowrap;
    font-family:Gloock,serif;font-weight:400;filter:drop-shadow(0 2px 8px rgb(30 4 8 / .6))}
  h1 .now{display:block;font-size:50px;line-height:1.1;letter-spacing:.005em}
  h1 .name{display:block;font-size:92px;line-height:1.05;letter-spacing:-.01em}
  /* The band under the photo: a thin gold rule, the promise, the address. */
  .band{position:absolute;left:0;right:0;top:1080px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    border-top:4px solid #B58A2F;border-image:linear-gradient(90deg,#94701F,#F2DC9C 50%,#94701F) 1}
  .promise{margin:0;font:600 40px/1.25 Figtree,sans-serif;color:#F2E4E6;text-align:center}
  .site{margin:6px 0 0;font:400 46px/1 Gloock,serif}
</style>
<div class="room"></div>
<h1><span class="now gold">We&rsquo;re now</span><span class="name gold">Heartwell Sofa</span></h1>
<div class="band">
  <p class="promise">Free UK Mainland delivery.<br>Nothing to pay until it&rsquo;s in your room.</p>
  <p class="site gold">heartwellsofa.co.uk</p>
</div>
