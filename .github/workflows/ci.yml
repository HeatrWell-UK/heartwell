name: CI

# Every push and pull request is checked. Vercel deploys straight from GitHub
# (staging = preview link, main = approved build), and its build runs the leak
# check first (the "prebuild" script), so a leak never deploys. A red run here
# means the deployment that went out with that push needs fixing.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Leak check and production build
        run: npm run build
